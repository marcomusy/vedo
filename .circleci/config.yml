version: 2.1

jobs:
  test-vedo:
    parameters:
      python-version:
        type: string
      vtk-requirement:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: medium
    environment:
      MPLBACKEND: Agg
      DEBIAN_FRONTEND: noninteractive
    steps:
      - checkout
      - run:
          name: Install rendering and build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libgl1 libegl1 libgl1-mesa-dri libxrender1 xvfb xauth
            python -m pip install build pytest scipy "<< parameters.vtk-requirement >>"
      - run:
          name: Build and install the wheel
          command: |
            python -m build --wheel
            python -m pip install dist/vedo-*.whl
      - run:
          name: Smoke-test the installed wheel outside the checkout
          command: |
            cd "$(mktemp -d)"
            vedo --help
            xvfb-run -a python - <<'PY'
            from pathlib import Path

            import vedo

            package = Path(vedo.__file__).resolve().parent
            assert "site-packages" in package.parts
            assert next((package / "examples").rglob("warp2.py"), None) is not None
            assert vedo.Text3D("vedo").npoints > 0
            with vedo.Plotter(offscreen=True, size=(240, 180)) as plotter:
                plotter.show(vedo.Sphere())
                plotter.screenshot("smoke.png")
            assert Path("smoke.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
            PY
      - run:
          name: Run the test suite
          command: xvfb-run -a python -m pytest --junitxml=test-reports/pytest.xml
      - store_test_results:
          path: test-reports

workflows:
  build-stuff:
    jobs:
      - test-vedo:
          name: python-3.10-vtk-9.7.1
          python-version: "3.10"
          vtk-requirement: "vtk==9.7.1"
      - test-vedo:
          name: python-3.14-vtk-current
          python-version: "3.14"
          vtk-requirement: vtk
